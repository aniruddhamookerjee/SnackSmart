# Database Configuration
# Credentials come from environment variables — never hardcode real values here.
# Set DB_USERNAME / DB_PASSWORD in your shell or a local .env before running.
spring.datasource.url=jdbc:mysql://localhost:3306/restaurant_db?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Server Configuration
server.port=9090

# CORS Configuration
cors.allowed-origins=http://localhost:3000

# JWT Configuration
# JWT_SECRET has no fallback on purpose — a real deployment must set its own.
# The value below is only used if you're running locally without setting one,
# and must never be relied on outside local development.
jwt.secret=${JWT_SECRET:local-dev-only-secret-change-before-any-real-use}
# 86400000 ms = 24 hours. The previous value (86400) was milliseconds, not
# seconds, so tokens were actually expiring after ~86 seconds.
jwt.expiration=86400000